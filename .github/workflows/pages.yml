name: Public site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Also validates the Gradle wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v6

      # Node's built-in test runner: the demo has no npm packages to install.
      - name: Test the demo
        run: node --test "site/demo/*.test.js"

      - name: Assemble the site
        run: ./gradlew siteBuild

      - name: Upload the site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  # Only main publishes, and only after the build passes, so a failed build leaves the
  # published site as it was.
  deploy:
    name: Publish to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
