spring.application.name=devplane

# DevPlane has no authentication yet, so only accept local connections.
# Override with SERVER_ADDRESS if it ever runs in a container.
server.address=127.0.0.1

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Generated services' Java packages start with this, e.g. io.github.spollito.ordersapi.
devplane.templates.base-package=io.github.spollito

# Repository provisioning. DevPlane starts without a token, but can't create
# repositories until DEVPLANE_GITHUB_TOKEN is set (see README.md).
devplane.github.api-url=https://api.github.com

# Pages keep flash messages in the session. Track it with a cookie only, so a
# session ID never appears in a redirect URL.
server.servlet.session.tracking-modes=cookie
